<text x="72.0" y="318" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">2. Evaluar</text>
<text x="72.0" y="338" fill="#334155" font-family="Arial, sans-serif" font-size="14">Revisa detalle y condiciones.</text>
<rect x="60.0" y="360" width="637.0" height="52" rx="8" fill="#f1f5f9"/>
<text x="72.0" y="382" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">3. Reservar</text>
<text x="72.0" y="402" fill="#334155" font-family="Arial, sans-serif" font-size="14">Solicita un intervalo válido.</text>
<rect x="60.0" y="424" width="637.0" height="52" rx="8" fill="#f1f5f9"/>
<text x="72.0" y="446" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">4. Confirmar</text>
<text x="72.0" y="466" fill="#334155" font-family="Arial, sans-serif" font-size="14">Recibe resultado trazable tras pago.</text>
<rect x="729.0" y="158" width="665.0" height="478" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="729.0" y="158" width="665.0" height="50" rx="12" fill="#2563eb"/>
<text x="747.0" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Propietario</text>
<rect x="743.0" y="232" width="637.0" height="52" rx="8" fill="#f1f5f9"/>
<text x="755.0" y="254" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">1. Publicar</text>
<text x="755.0" y="274" fill="#334155" font-family="Arial, sans-serif" font-size="14">Registra un espacio bajo su control.</text>
<rect x="743.0" y="296" width="637.0" height="52" rx="8" fill="#f1f5f9"/>
<text x="755.0" y="318" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">2. Configurar</text>
<text x="755.0" y="338" fill="#334155" font-family="Arial, sans-serif" font-size="14">Define horario, precio y estado.</text>
<rect x="743.0" y="360" width="637.0" height="52" rx="8" fill="#f1f5f9"/>
<text x="755.0" y="382" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">3. Gestionar</text>
<text x="755.0" y="402" fill="#334155" font-family="Arial, sans-serif" font-size="14">Revisa reservas asociadas.</text>
<rect x="743.0" y="424" width="637.0" height="52" rx="8" fill="#f1f5f9"/>
<text x="755.0" y="446" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">4. Consultar</text>
