<text x="72.0" y="254" fill="#0f172a" font-family="Arial, sans-serif" font-size="15" font-weight="700">1. Buscar</text>
<text x="72.0" y="274" fill="#334155" font-family="Arial, sans-serif" font-size="14">Indica destino y consulta opciones.</text>
